<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0c10">
<title>Data Probe</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --bg: #0a0c10; --card: #12151f; --card2: #171b26;
    --border: #1f2430; --border-hi: #2c3346;
    --text: #e6e8ee; --text-dim: #8b93a5; --text-faint: #6b7488;
    --accent: #7c8cff; --ok: #4ade80; --warn: #f5c76e; --danger: #f87171;
    --nav-h: 62px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .perm-banner {
    display: none; flex-shrink: 0;
    background: linear-gradient(180deg, #2a1a12, #1e140e);
    border-bottom: 1px solid #5a3a1a; color: var(--warn);
    padding: 12px 16px; font-size: 13px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .perm-banner.show { display: block; }
  .perm-msg { margin-bottom: 10px; font-weight: 500; }
  .perm-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .perm-actions button {
    background: #3a2412; border: 1px solid #5a3a1a; color: var(--warn);
    padding: 7px 14px; font-size: 12.5px; border-radius: 8px;
    font-family: inherit; cursor: pointer;
  }

  main {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px 16px calc(var(--nav-h) + 24px);
    -webkit-overflow-scrolling: touch;
  }
  .tab { display: none; animation: fadeIn .2s ease; }
  .tab.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 18px; color: #a8b2ff; margin: 0 0 4px; letter-spacing: -0.3px; }
  .subtitle { font-size: 12.5px; color: var(--text-faint); margin: 0 0 20px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-faint); margin: 22px 0 10px; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }

  dl {
    display: grid; grid-template-columns: 42% 1fr; gap: 8px 14px;
    margin: 0; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    font-size: 13px;
  }
  dt { color: var(--text-dim); }
  dd { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
       word-break: break-word; color: #d5dae8; }
  dd a { color: var(--accent); text-decoration: none; }
  dd .err { color: var(--warn); }

  .btn {
    font: inherit; font-size: 13.5px; font-weight: 500;
    padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--border-hi);
    background: var(--card2); color: var(--text);
    cursor: pointer; margin: 0 6px 8px 0;
    transition: background .15s, transform .05s;
  }
  .btn:active { transform: scale(0.97); background: #232a3a; }
  .btn:disabled { opacity: 0.55; }
  .btn-primary { background: linear-gradient(135deg, #3a4680, #2a3160);
                 border-color: #4a5380; color: #cfe0ff; }
  .btn-danger { background: #2a1216; border-color: #5a1e24; color: #f08c8c; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }

  .back-bar {
    display: flex; align-items: center; gap: 8px;
    margin: -8px 0 14px; padding: 0;
  }
  .back-btn {
    background: none; border: none; color: var(--accent);
    font: inherit; font-size: 15px; font-weight: 500;
    padding: 8px 10px 8px 0; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  .back-btn:active { opacity: 0.6; }

  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 11px; margin-bottom: 8px; overflow: hidden;
  }
  .item > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; font-size: 13.5px;
  }
  .item > summary::-webkit-details-marker { display: none; }
  .item[open] > summary { background: var(--card2); }
  .item .name { font-weight: 600; word-break: break-word; }
  .item .meta { color: var(--text-dim); font-size: 11.5px;
                font-family: ui-monospace, monospace; flex-shrink: 0; }
  .item .body {
    padding: 10px 14px 14px; border-top: 1px solid var(--border);
    font-size: 12px; font-family: ui-monospace, monospace;
    color: #b8c1d4; white-space: pre-wrap; word-break: break-all; line-height: 1.6;
  }

  /* Network cards in the history list — big tappable rows with chevron */
  .net-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 11px; padding: 13px 14px; margin-bottom: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    transition: background .15s;
  }
  .net-card:active { background: var(--card2); }
  .net-card .left { flex: 1; min-width: 0; }
  .net-card .net-ssid {
    font-weight: 600; font-size: 14px; word-break: break-word;
    margin-bottom: 3px;
  }
  .net-card .net-sub {
    font-size: 11.5px; color: var(--text-dim);
    font-family: ui-monospace, monospace;
  }
  .net-card .net-counts {
    display: flex; gap: 12px; margin-top: 6px;
    font-size: 11px; color: var(--text-faint);
  }
  .net-card .net-counts strong { color: var(--text-dim); font-weight: 600; }
  .net-card .chev {
    color: var(--text-faint); font-size: 20px; flex-shrink: 0;
  }

  .empty {
    color: var(--text-faint); font-size: 12.5px;
    padding: 14px; text-align: center;
    background: var(--card); border: 1px dashed var(--border);
    border-radius: 11px;
  }
  .loading {
    color: var(--text-dim); font-size: 13px;
    padding: 20px; text-align: center;
  }
  .loading::before {
    content: ""; display: inline-block;
    width: 12px; height: 12px; margin-right: 8px;
    border: 2px solid var(--border-hi); border-top-color: var(--accent);
    border-radius: 50%; vertical-align: -2px;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .app-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 14px 8px;
  }
  .app-tile { display: flex; flex-direction: column; align-items: center;
              gap: 6px; text-align: center; }
  .app-tile img, .app-tile .fallback {
    width: 48px; height: 48px; border-radius: 12px;
    background: #1b202c; border: 1px solid #232a3a; object-fit: contain;
  }
  .app-tile .fallback { display: flex; align-items: center; justify-content: center;
                        font-size: 20px; font-weight: 700; color: var(--accent); }
  .app-tile .label { font-size: 10.5px; line-height: 1.25; color: #c8cfe0;
                     word-break: break-word; max-width: 100%; }

  #map { height: 280px; border-radius: 12px; overflow: hidden;
         background: var(--card); border: 1px solid var(--border); margin-top: 4px; }
  .leaflet-container { background: #12151f; }

  #historyList, #wifiDetailSightings, #wifiDetailConnections {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 11px; overflow: hidden; margin-bottom: 10px;
  }
  .hist-item {
    font-size: 11.5px; font-family: ui-monospace, monospace;
    color: #b8c1d4; padding: 9px 14px; border-bottom: 1px solid #1a1f2a;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-item a { color: var(--accent); text-decoration: none; }

  .live { display: inline-block; font-size: 11px; color: var(--ok);
          vertical-align: middle; margin-left: 6px; }
  .live::before { content: ""; display: inline-block;
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    margin-right: 5px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(12, 14, 20, 0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: stretch;
    z-index: 100;
  }
  .tabbar button {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; color: var(--text-faint);
    font: inherit; font-size: 10.5px; cursor: pointer;
    padding: 0; position: relative; transition: color .15s;
  }
  .tabbar button svg {
    width: 22px; height: 22px; stroke: currentColor;
    fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar button.active::before {
    content: ""; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 28px; height: 2.5px; border-radius: 0 0 3px 3px;
    background: var(--accent);
  }
</style>
</head>
<body>

<div class="perm-banner" id="permBanner">
  <div class="perm-msg" id="permMsg"></div>
  <div class="perm-actions">
    <button id="btnGrantPerms">Grant permissions</button>
    <button id="btnEnableLoc" style="display:none;">Turn on Location</button>
    <button id="btnEnableBt" style="display:none;">Turn on Bluetooth</button>
    <button id="btnEnableWifi" style="display:none;">Turn on Wi-Fi</button>
  </div>
</div>

<main>

  <section id="tab-home" class="tab active">
    <h1>Data Probe</h1>
    <p class="subtitle">Native Android information, gathered locally.</p>
    <h2>Device &amp; OS</h2>
    <dl id="devInfo"></dl>
  </section>

  <!-- ================= WI-FI ================= -->
  <section id="tab-wifi" class="tab">
    <!-- Root view -->
    <div id="wifiViewRoot">
      <h1>Wi-Fi</h1>
      <h2>Current connection</h2>
      <dl id="wifiInfo"></dl>
      <h2>Nearby networks</h2>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnScanWifi">Scan now</button>
        <button class="btn" id="btnLiveWifi">Start live scan</button>
      </div>
      <div id="wifiList"></div>
      <h2>Wi-Fi history</h2>
      <button class="btn btn-primary" id="btnWifiNetworks" style="width:100%;">Open Wi-Fi history</button>
    </div>

    <!-- Networks list view -->
    <div id="wifiViewNetworks" style="display:none;">
      <div class="back-bar">
        <button class="back-btn" id="wifiBackToRoot">← Wi-Fi</button>
      </div>
      <h1>Wi-Fi history</h1>
      <p class="subtitle" id="wifiNetworksSummary"></p>
      <div id="wifiNetworksList"></div>
      <button class="btn btn-danger" id="btnClearWifiNetworks" style="width:100%;">Clear all history</button>
    </div>

    <!-- Detail view -->
    <div id="wifiViewDetail" style="display:none;">
      <div class="back-bar">
        <button class="back-btn" id="wifiBackToNetworks">← History</button>
      </div>
      <h1 id="wifiDetailTitle"></h1>
      <p class="subtitle" id="wifiDetailSubtitle"></p>
      <h2>Summary</h2>
      <dl id="wifiDetailInfo"></dl>
      <h2>Connections <span id="wifiDetailConnCount" style="font-size:11px;color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;"></span></h2>
      <div id="wifiDetailConnections"></div>
      <h2>Sightings <span id="wifiDetailSigCount" style="font-size:11px;color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;"></span></h2>
      <div id="wifiDetailSightings"></div>
    </div>
  </section>

  <section id="tab-bt" class="tab">
    <h1>Bluetooth</h1>
    <h2>Paired devices</h2>
    <div id="btPaired"></div>
    <h2>Live discovery</h2>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnScanBt">Start scan</button>
      <button class="btn" id="btnStopBt">Stop</button>
    </div>
    <div id="btList"></div>
  </section>

  <section id="tab-loc" class="tab">
    <h1>Location</h1>
    <h2>Last known fix</h2>
    <dl id="locInfo"></dl>
    <div class="btn-row">
      <button class="btn" id="btnOpenMaps">Open in Google Maps</button>
      <button class="btn btn-primary" id="btnLiveTrack">Start live tracking</button>
      <button class="btn" id="btnRefreshMap">Refresh map</button>
    </div>
    <h2>Live map<span class="live" id="liveIndicator" style="display:none;">live</span></h2>
    <div id="map"></div>
    <h2>History <span id="histCount" style="font-size:11px; color:var(--text-faint); font-weight:400; text-transform:none; letter-spacing:0;"></span></h2>
    <div id="historyList"></div>
    <button class="btn btn-danger" id="btnClearHistory">Clear history</button>
  </section>

  <section id="tab-apps" class="tab">
    <h1>Installed Apps</h1>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnLoadApps">Show installed applications</button>
    </div>
    <div class="btn-row" id="appFilters" style="display:none;">
      <button class="btn" data-filter="user">User apps</button>
      <button class="btn" data-filter="system">System apps</button>
      <button class="btn" data-filter="all">All</button>
    </div>
    <div id="appsGrid"></div>
  </section>

</main>

<nav class="tabbar">
  <button data-tab="home" class="active">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button data-tab="wifi">
    <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><circle cx="12" cy="20" r="0.6" fill="currentColor"/></svg>
    <span>Wi-Fi</span>
  </button>
  <button data-tab="bt">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg>
    <span>Bluetooth</span>
  </button>
  <button data-tab="loc">
    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    <span>Location</span>
  </button>
  <button data-tab="apps">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Apps</span>
  </button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const safeJSON = (s, fb) => { try { return JSON.parse(s); } catch { return fb; } };

  function renderDL(el, data, emptyMsg) {
    el.innerHTML = "";
    if (!data || Object.keys(data).length === 0) {
      if (emptyMsg) {
        const dd = document.createElement("dd");
        dd.textContent = emptyMsg; dd.style.color = "#6b7488";
        dd.style.gridColumn = "1 / -1"; el.appendChild(dd);
      }
      return;
    }
    for (const [k, v] of Object.entries(data)) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd");
      if (k === "MapsUrl" && typeof v === "string") {
        const a = document.createElement("a");
        a.href = v; a.textContent = "Open in Google Maps →";
        a.addEventListener("click", e => { e.preventDefault(); openExternal(v); });
        dd.appendChild(a);
      } else {
        dd.textContent = (v && typeof v === "object") ? JSON.stringify(v) : v;
        if (k === "error") dd.classList.add("err");
      }
      el.append(dt, dd);
    }
  }

  function itemHTML(name, meta, details) {
    return '<details class="item">' +
      '<summary><span class="name">' + esc(name) + '</span>' +
      '<span class="meta">' + esc(meta) + '</span></summary>' +
      '<div class="body">' + esc(details) + '</div></details>';
  }

  function deviceTypeLabel(t) {
    return t === 1 ? "Classic" : t === 2 ? "LE" : t === 3 ? "Dual" : "Unknown";
  }
  function freqBand(f) {
    return f >= 5925 ? "6 GHz" : f >= 4900 ? "5 GHz" : f >= 2400 ? "2.4 GHz" : f + " MHz";
  }
  function openExternal(url) { try { location.href = url; } catch (e) {} }

  function fmtDate(ts) {
    if (!ts) return "—";
    const d = new Date(ts);
    return d.toLocaleString();
  }

  /* ============ Tabs ============ */
  const tabs = document.querySelectorAll(".tabbar button");
  const tabSections = document.querySelectorAll("main .tab");

  function showTab(name) {
    tabSections.forEach(s => s.classList.toggle("active", s.id === "tab-" + name));
    tabs.forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    document.querySelector("main").scrollTop = 0;
    if (name === "loc") setTimeout(() => { if (map) map.invalidateSize(); }, 60);
  }
  tabs.forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

  /* ============ Back handler ============ */
  let wifiSubView = "root";
  let currentBssidForDetail = null;

  window.__backHandler = function () {
    if (wifiSubView === "detail") { showWifiView("networks"); return true; }
    if (wifiSubView === "networks") { showWifiView("root"); return true; }
    const active = document.querySelector(".tabbar button.active");
    if (active && active.dataset.tab !== "home") { showTab("home"); return true; }
    return false;
  };

  /* ============ Permission banner ============ */
  const permBanner = $("permBanner");
  window.onPermissionsChanged = function (allGranted, locOn, btOn, wifiOn) {
    const needsPerms = !allGranted;
    const needsLoc = allGranted && !locOn;
    const needsBt = allGranted && !btOn;
    const needsWifi = allGranted && !wifiOn;
    if (!needsPerms && !needsLoc && !needsBt && !needsWifi) {
      permBanner.classList.remove("show"); return;
    }
    permBanner.classList.add("show");
    const parts = [];
    if (needsPerms) parts.push("permissions");
    if (needsLoc) parts.push("Location");
    if (needsBt) parts.push("Bluetooth");
    if (needsWifi) parts.push("Wi-Fi");
    $("permMsg").textContent = "Enable " + parts.join(", ") + " to gather full data";
    $("btnGrantPerms").style.display = needsPerms ? "" : "none";
    $("btnEnableLoc").style.display = needsLoc ? "" : "none";
    $("btnEnableBt").style.display = needsBt ? "" : "none";
    $("btnEnableWifi").style.display = needsWifi ? "" : "none";
  };
  $("btnGrantPerms").addEventListener("click", () => Android.requestPermissionsFromUi());
  $("btnEnableLoc").addEventListener("click", () => Android.enableLocationFromUi());
  $("btnEnableBt").addEventListener("click", () => Android.enableBluetoothFromUi());
  $("btnEnableWifi").addEventListener("click", () => Android.openWifiSettings());

  function refreshPermissionBanner() {
    const st = safeJSON(Android.getPermissionStatus(), {});
    window.onPermissionsChanged(st.allGranted, st.locationEnabled,
      st.bluetoothEnabled, st.wifiEnabled);
  }

  /* ============ Update callbacks ============ */
  window.onWifiInfoUpdated = info => renderDL($("wifiInfo"), info);
  window.onBondedDevicesUpdated = list => renderBonded(list);
  window.onLocationUpdated = loc => {
    renderDL($("locInfo"), loc);
    if (typeof loc.Latitude === "number") {
      currentLat = loc.Latitude; currentLon = loc.Longitude;
      $("btnOpenMaps").disabled = false;
    }
  };
  window.onLocationStateChanged = on => {
    refreshPermissionBanner();
    window.onLocationUpdated(safeJSON(Android.getLocation(), {}));
  };

  /* ============ HOME ============ */
  renderDL($("devInfo"), safeJSON(Android.getDeviceInfo(), {}));

  /* ============ WI-FI ============ */
  renderDL($("wifiInfo"), safeJSON(Android.getWifiInfo(), {}));

  function signalInfo(rssi) {
    const pct = Math.max(0, Math.min(100, Math.round(2 * (rssi + 100))));
    const bars = rssi >= -55 ? 4 : rssi >= -65 ? 3 : rssi >= -75 ? 2 : 1;
    const color = bars === 4 ? "#4ade80" : bars === 3 ? "#a3e635"
                : bars === 2 ? "#f5c76e" : "#f87171";
    let svg = '<svg width="22" height="16" viewBox="0 0 22 16" style="vertical-align:middle;margin-right:6px;">';
    for (let i = 0; i < 4; i++) {
      const h = 4 + i * 3;
      svg += '<rect x="' + (i * 5) + '" y="' + (16 - h) +
             '" width="3.5" height="' + h + '" rx="1" fill="' +
             (i < bars ? color : '#2c3346') + '"/>';
    }
    svg += '</svg>';
    return { svg, pct, color, bars };
  }

  function wifiItemHTML(n) {
    const name = n.SSID || "(hidden network)";
    const sig = signalInfo(n.Level);
    const metaHTML = sig.svg + '<span style="color:' + sig.color +
                     ';font-weight:600;">' + sig.pct + '%</span>';
    const detail =
      "SSID:         " + name + "\n" +
      "BSSID:        " + n.BSSID + "\n" +
      "Signal:       " + n.Level + " dBm (" + sig.pct + "%)\n" +
      "Bars:         " + sig.bars + " / 4\n" +
      "Frequency:    " + n.Frequency + " MHz (" + freqBand(n.Frequency) + ")\n" +
      "Capabilities: " + (n.Capabilities || "(open network)");
    return '<details class="item">' +
      '<summary><span class="name">' + esc(name) + '</span>' +
      '<span class="meta">' + metaHTML + '</span></summary>' +
      '<div class="body">' + esc(detail) + '</div></details>';
  }

  let liveWifiScanning = false;

  $("btnScanWifi").addEventListener("click", () => {
    $("btnScanWifi").disabled = true;
    $("wifiList").innerHTML = '<div class="loading">Scanning…</div>';
    Android.startWifiScan();
  });

  $("btnLiveWifi").addEventListener("click", () => {
    if (liveWifiScanning) {
      Android.stopLiveWifiScan();
      liveWifiScanning = false;
      $("btnLiveWifi").textContent = "Start live scan";
      $("btnLiveWifi").classList.remove("btn-danger");
      $("btnLiveWifi").classList.add("btn-primary");
    } else {
      liveWifiScanning = true;
      $("btnLiveWifi").textContent = "Stop live scan";
      $("btnLiveWifi").classList.remove("btn-primary");
      $("btnLiveWifi").classList.add("btn-danger");
      $("wifiList").innerHTML = '<div class="loading">Live scanning (every ~35s)…</div>';
      Android.startLiveWifiScan();
    }
  });

  window.onWifiScanComplete = function (results) {
    $("btnScanWifi").disabled = false;
    if (!results.length) {
      if (!liveWifiScanning)
        $("wifiList").innerHTML = '<div class="empty">No networks found.</div>';
      return;
    }
    results.sort((a, b) => b.Level - a.Level);
    $("wifiList").innerHTML = results.map(wifiItemHTML).join("");
  };

  window.onWifiScanError = msg => {
    $("btnScanWifi").disabled = false;
    if (!liveWifiScanning)
      $("wifiList").innerHTML = '<div class="empty">Scan error: ' + esc(msg) + '</div>';
  };

  /* ---- View switching ---- */
  const views = { root: $("wifiViewRoot"), networks: $("wifiViewNetworks"), detail: $("wifiViewDetail") };
  function showWifiView(name) {
    wifiSubView = name;
    Object.entries(views).forEach(([k, el]) => el.style.display = (k === name ? "" : "none"));
    document.querySelector("main").scrollTop = 0;
    if (name === "networks") renderNetworksList();
  }

  $("btnWifiNetworks").addEventListener("click", () => showWifiView("networks"));
  $("wifiBackToRoot").addEventListener("click", () => showWifiView("root"));
  $("wifiBackToNetworks").addEventListener("click", () => showWifiView("networks"));

  /* ---- Networks list ---- */
  function renderNetworksList() {
    const list = safeJSON(Android.getWifiNetworkList(), []);
    list.sort((a, b) => b.lastSeen - a.lastSeen);
    $("wifiNetworksSummary").textContent =
      list.length + " unique network" + (list.length === 1 ? "" : "s") + " in history";

    if (!list.length) {
      $("wifiNetworksList").innerHTML = '<div class="empty">No history yet. Run a scan or connect to Wi-Fi.</div>';
      return;
    }

    $("wifiNetworksList").innerHTML = list.map(n => {
      const ssid = n.ssid || "(hidden)";
      return '<div class="net-card" data-bssid="' + esc(n.bssid) + '">' +
        '<div class="left">' +
          '<div class="net-ssid">' + esc(ssid) + '</div>' +
          '<div class="net-sub">' + esc(n.bssid) + '</div>' +
          '<div class="net-counts">' +
            '<span>Seen <strong>' + n.sightings + '</strong>×</span>' +
            '<span>Connected <strong>' + n.connections + '</strong>×</span>' +
            '<span>' + esc(fmtDate(n.lastSeen)) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="chev">›</div>' +
      '</div>';
    }).join("");

    $("wifiNetworksList").querySelectorAll(".net-card").forEach(card => {
      card.addEventListener("click", () => openNetworkDetail(card.dataset.bssid));
    });
  }

  $("btnClearWifiNetworks").addEventListener("click", () => {
    if (!confirm("Clear all Wi-Fi history? This cannot be undone.")) return;
    Android.clearWifiNetworks();
    renderNetworksList();
  });

  /* ---- Network detail ---- */
  function openNetworkDetail(bssid) {
    const detail = safeJSON(Android.getWifiNetworkDetail(bssid), null);
    if (!detail) { alert("Network not found."); return; }
    currentBssidForDetail = bssid;
    showWifiView("detail");
    renderNetworkDetail(detail);
  }

  function renderNetworkDetail(d) {
    const ssid = d.ssid || "(hidden)";
    $("wifiDetailTitle").textContent = ssid;
    $("wifiDetailSubtitle").textContent = d.bssid || "";

    const sightings = d.sightings || [];
    const connections = d.connections || [];

    renderDL($("wifiDetailInfo"), {
      "SSID":        ssid,
      "BSSID":       d.bssid || "—",
      "First seen":  fmtDate(d.firstSeen),
      "Last seen":   fmtDate(d.lastSeen),
      "Sightings":   sightings.length,
      "Connections": connections.length
    });

    /* Connections */
    $("wifiDetailConnCount").textContent = connections.length ? "(" + connections.length + ")" : "";
    if (!connections.length) {
      $("wifiDetailConnections").innerHTML = '<div class="empty">Never connected from this device.</div>';
    } else {
      const sorted = connections.slice().reverse();
      $("wifiDetailConnections").innerHTML = sorted.map(c => {
        const t = fmtDate(c[0]);
        let where = "location unavailable";
        if (typeof c[1] === "number" && typeof c[2] === "number") {
          where = '<a href="#" data-lat="' + c[1] + '" data-lon="' + c[2] + '">' +
                  c[1].toFixed(5) + ", " + c[2].toFixed(5) + '</a>';
        }
        return '<div class="hist-item">🔗 ' + esc(t) + ' · ' + where + '</div>';
      }).join("");
    }

    /* Sightings */
    $("wifiDetailSigCount").textContent = sightings.length ? "(" + sightings.length + ")" : "";
    if (!sightings.length) {
      $("wifiDetailSightings").innerHTML = '<div class="empty">No sightings recorded.</div>';
    } else {
      const sorted = sightings.slice().reverse();
      const show = sorted.slice(0, 300); // display cap for perf; storage is unlimited
      $("wifiDetailSightings").innerHTML = show.map(s => {
        const t = fmtDate(s[0]);
        const sig = signalInfo(s[4] || -100);
        let where = "location unavailable";
        if (typeof s[1] === "number" && typeof s[2] === "number") {
          where = '<a href="#" data-lat="' + s[1] + '" data-lon="' + s[2] + '">' +
                  s[1].toFixed(5) + ", " + s[2].toFixed(5) + '</a>';
        }
        return '<div class="hist-item">' +
          sig.svg + esc(t) + ' · ' + esc(s[4] || 0) + ' dBm (' + sig.pct + '%) · ' + where +
        '</div>';
      }).join("") + (sorted.length > 300
        ? '<div class="empty">Showing latest 300 of ' + sorted.length + ' sightings.</div>'
        : "");
    }

    /* Wire map links */
    document.querySelectorAll("#wifiDetailConnections a, #wifiDetailSightings a").forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        openExternal("https://www.google.com/maps?q=" + a.dataset.lat + "," + a.dataset.lon);
      });
    });
  }

  /* ============ BLUETOOTH ============ */
  function renderBonded(list) {
    $("btPaired").innerHTML = list.length
      ? list.map(d => itemHTML(d.Name, d.Address,
          "Address:  " + d.Address + "\nType:     " + deviceTypeLabel(d.Type) + "\nPaired:   yes"
        )).join("")
      : '<div class="empty">No paired devices.</div>';
  }
  renderBonded(safeJSON(Android.getBluetoothBondedDevices(), []));

  const btSeen = new Set();
  $("btnScanBt").addEventListener("click", () => {
    btSeen.clear();
    $("btnScanBt").disabled = true;
    $("btList").innerHTML = '<div class="loading">Scanning…</div>';
    Android.startBluetoothDiscovery();
  });
  $("btnStopBt").addEventListener("click", () => Android.stopBluetoothDiscovery());

  window.onBluetoothDeviceFound = d => {
    if (btSeen.has(d.Address)) return;
    btSeen.add(d.Address);
    if (btSeen.size === 1) $("btList").innerHTML = "";
    $("btList").insertAdjacentHTML("beforeend", itemHTML(d.Name, d.RSSI + "dBm",
      "Name:     " + d.Name + "\nAddress:  " + d.Address + "\nRSSI:     " + d.RSSI + " dBm\n" +
      "Type:     " + deviceTypeLabel(d.Type) + "\nPaired:   " + (d.Bonded ? "yes" : "no") +
      "\nSource:   " + (d.Source === "ble" ? "BLE" : "Classic")));
  };

  window.onBluetoothScanComplete = () => {
    $("btnScanBt").disabled = false;
    if (btSeen.size === 0) $("btList").innerHTML = '<div class="empty">No devices found.</div>';
    else $("btList").insertAdjacentHTML("beforeend",
      '<div class="empty">— scan complete (' + btSeen.size + ') —</div>');
  };

  window.onBluetoothError = msg => {
    $("btnScanBt").disabled = false;
    $("btList").innerHTML = '<div class="empty">Error: ' + esc(msg) + '</div>';
  };

  /* ============ LOCATION ============ */
  let currentLat = null, currentLon = null;
  renderDL($("locInfo"), safeJSON(Android.getLocation(), {}));
  const initialLoc = safeJSON(Android.getLocation(), {});
  if (typeof initialLoc.Latitude === "number") {
    currentLat = initialLoc.Latitude; currentLon = initialLoc.Longitude;
    $("btnOpenMaps").disabled = false;
  } else $("btnOpenMaps").disabled = true;

  $("btnOpenMaps").addEventListener("click", () => {
    if (currentLat == null) return;
    openExternal("https://www.google.com/maps?q=" + currentLat + "," + currentLon);
  });

  let map = null, marker = null, trail = null, trailPoints = [];
  let mapReady = false;

  function initMap() {
    if (mapReady) { if (map) setTimeout(() => map.invalidateSize(), 40); return; }
    if (typeof L === "undefined") { setTimeout(initMap, 150); return; }
    mapReady = true;
    map = L.map("map", { zoomControl: true }).setView([0, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    trail = L.polyline([], { color: "#7c8cff", weight: 4, opacity: 0.85 }).addTo(map);
    marker = L.circleMarker([0, 0], { radius: 9, color: "#7c8cff",
      fillColor: "#7c8cff", fillOpacity: 0.9, weight: 3 }).addTo(map);
    setTimeout(() => map.invalidateSize(), 80);
    setTimeout(() => map.invalidateSize(), 400);
    setTimeout(() => map.invalidateSize(), 1200);
    drawHistory(safeJSON(Android.getLocationHistory(), []));
  }

  function drawHistory(hist) {
    if (!map) return;
    trailPoints = hist.map(p => [p.lat, p.lon]);
    trail.setLatLngs(trailPoints);
    $("histCount").textContent = hist.length ? "(" + hist.length + " points)" : "";
    if (!hist.length) {
      $("historyList").innerHTML = '<div class="empty">No saved points yet.</div>';
      return;
    }
    const recent = hist.slice(-20).reverse();
    $("historyList").innerHTML = recent.map(p =>
      '<div class="hist-item">' +
      '<a href="#" data-lat="' + p.lat + '" data-lon="' + p.lon + '">' +
      p.lat.toFixed(5) + ", " + p.lon.toFixed(5) + '</a>' +
      "  ±" + Math.round(p.acc || 0) + "m · " + new Date(p.t).toLocaleString() + '</div>'
    ).join("");
    $("historyList").querySelectorAll("a").forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        openExternal("https://www.google.com/maps?q=" + a.dataset.lat + "," + a.dataset.lon);
      });
    });
  }

  $("btnRefreshMap").addEventListener("click", () => {
    initMap();
    setTimeout(() => {
      if (map) map.invalidateSize();
      drawHistory(safeJSON(Android.getLocationHistory(), []));
    }, 100);
  });

  let tracking = false;
  $("btnLiveTrack").addEventListener("click", () => {
    if (tracking) Android.stopLiveTracking();
    else {
      initMap();
      setTimeout(() => { if (map) map.invalidateSize(); }, 100);
      Android.startLiveTracking();
    }
  });

  window.onLiveLocationStarted = () => {
    tracking = true;
    const b = $("btnLiveTrack");
    b.textContent = "Stop live tracking";
    b.classList.remove("btn-primary"); b.classList.add("btn-danger");
    $("liveIndicator").style.display = "inline";
  };
  window.onLiveLocationStopped = () => {
    tracking = false;
    const b = $("btnLiveTrack");
    b.textContent = "Start live tracking";
    b.classList.remove("btn-danger"); b.classList.add("btn-primary");
    $("liveIndicator").style.display = "none";
  };
  window.onLiveLocationError = msg => {
    tracking = false;
    const b = $("btnLiveTrack");
    b.textContent = "Start live tracking";
    b.classList.remove("btn-danger"); b.classList.add("btn-primary");
    $("liveIndicator").style.display = "none";
    alert("Live tracking: " + msg);
  };
  window.onLiveLocationUpdate = loc => {
    initMap();
    if (!map) return;
    marker.setLatLng([loc.Latitude, loc.Longitude]);
    trailPoints.push([loc.Latitude, loc.Longitude]);
    trail.setLatLngs(trailPoints);
    map.setView([loc.Latitude, loc.Longitude], Math.max(map.getZoom() || 16, 16));
    currentLat = loc.Latitude; currentLon = loc.Longitude;
    renderDL($("locInfo"), {
      Latitude: loc.Latitude, Longitude: loc.Longitude,
      Accuracy: loc.Accuracy, Altitude: loc.Altitude, Speed: loc.Speed,
      MapsUrl: "https://www.google.com/maps?q=" + loc.Latitude + "," + loc.Longitude
    });
    $("btnOpenMaps").disabled = false;
    if (trailPoints.length % 3 === 0)
      drawHistory(safeJSON(Android.getLocationHistory(), []));
  };

  $("btnClearHistory").addEventListener("click", () => {
    if (!confirm("Clear all saved location history?")) return;
    Android.clearLocationHistory();
    trailPoints = [];
    if (trail) trail.setLatLngs([]);
    drawHistory([]);
  });

  /* Lazy map init when Location tab is first opened */
  let mapInited = false;
  tabs.forEach(b => b.addEventListener("click", () => {
    if (b.dataset.tab === "loc" && !mapInited) {
      mapInited = true;
      setTimeout(initMap, 150);
    }
  }));

  /* ============ INSTALLED APPS ============ */
  let appsCache = null, currentFilter = "all", appsTimeout = null;

  $("btnLoadApps").addEventListener("click", () => {
    const btn = $("btnLoadApps");
    btn.disabled = true;
    btn.textContent = "Loading…";
    $("appsGrid").innerHTML = '<div class="loading">Reading installed applications…</div>';
    $("appFilters").style.display = "none";
    clearTimeout(appsTimeout);
    appsTimeout = setTimeout(() => {
      btn.disabled = false;
      btn.textContent = "Retry";
      $("appsGrid").innerHTML = '<div class="empty">Timed out. Tap Retry.</div>';
    }, 15000);
    try { Android.loadAppsAsync("all"); }
    catch (e) {
      clearTimeout(appsTimeout);
      btn.disabled = false; btn.textContent = "Retry";
      $("appsGrid").innerHTML = '<div class="empty">Failed: ' + esc(e.message) + '</div>';
    }
  });

  window.onAppsLoaded = apps => {
    clearTimeout(appsTimeout);
    appsCache = apps;
    const btn = $("btnLoadApps");
    btn.disabled = false;
    btn.textContent = "Reload apps";
    $("appFilters").style.display = "";
    document.querySelectorAll("#appFilters button").forEach(b => {
      b.classList.toggle("btn-primary", b.dataset.filter === currentFilter);
    });
    renderApps(apps, currentFilter);
  };

  document.querySelectorAll("#appFilters button").forEach(b => {
    b.addEventListener("click", () => {
      currentFilter = b.dataset.filter;
      document.querySelectorAll("#appFilters button").forEach(x => {
        x.classList.toggle("btn-primary", x === b);
      });
      if (appsCache) renderApps(appsCache, currentFilter);
    });
  });

  function renderApps(apps, filter) {
    const list = apps.filter(a => filter === "all" || a.Type === filter);
    $("appsGrid").innerHTML = list.length
      ? '<div class="app-grid">' + list.map(a => {
          const icon = a.Icon
            ? '<img src="' + a.Icon + '" alt="">'
            : '<div class="fallback">' + esc((a.Name[0] || "?").toUpperCase()) + '</div>';
          return '<div class="app-tile" title="' + esc(a.Package) + '">' +
                 icon + '<div class="label">' + esc(a.Name) + '</div></div>';
        }).join("") + '</div>'
      : '<div class="empty">No apps in this filter.</div>';
  }

  /* ============ Load apps cache on startup ============ */
  (function loadAppsFromCache() {
    try {
      const cached = safeJSON(Android.getCachedApps(), []);
      if (cached && cached.length) {
        appsCache = cached;
        $("btnLoadApps").textContent = "Reload apps";
        $("appFilters").style.display = "";
        document.querySelectorAll("#appFilters button").forEach(b => {
          b.classList.toggle("btn-primary", b.dataset.filter === currentFilter);
        });
        renderApps(appsCache, currentFilter);
      }
    } catch (e) {}
  })();

  refreshPermissionBanner();

})();
</script>
</body>
</html>
